name: ml_crash_course
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.12
  - pip
  - tqdm

  # Data Processing and Visualization
  - pandas
  - numpy
  - plotly
  - seaborn

  # Machine Learning (Scikit-Learn & Imbalance)
  - scikit-learn
  - imbalanced-learn

  # Gradient Boosting Models
  - xgboost
  - lightgbm
  - catboost
  - statsforecast

  # Time Series (Module 3)
  - prophet

  # Experiment Tracking (Module 2)
  - mlflow

  # Notebooks & Tools
  - jupytext
  - jupyterlab
  - ipykernel
  - nbformat